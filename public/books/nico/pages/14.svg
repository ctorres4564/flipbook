<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="600" height="800">
  <defs>
    <linearGradient id="grad-14" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#312e81" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Fundo com gradiente -->
  <rect width="600" height="800" fill="url(#grad-14)" />

  <!-- Detalhes ornamentais de fundo -->
  <circle cx="500" cy="150" r="180" fill="rgba(255,255,255,0.06)" />
  <circle cx="100" cy="700" r="140" fill="rgba(255,255,255,0.05)" />
  <path d="M -50 400 Q 300 300 650 400" stroke="rgba(255,255,255,0.12)" stroke-width="6" fill="none" />
  <path d="M -50 440 Q 300 340 650 440" stroke="rgba(255,255,255,0.08)" stroke-width="4" fill="none" />

  <!-- Ilustração Central com Moldura Flutuante -->
  <g filter="url(#shadow)">
    <rect x="60" y="70" width="480" height="420" rx="24" fill="rgba(255, 255, 255, 0.08)" />
    <text x="300" y="250" font-family="'Plus Jakarta Sans', sans-serif" font-size="96" text-anchor="middle">✨</text>
    <text x="300" y="340" font-family="'Outfit', sans-serif" font-weight="bold" font-size="28" fill="#ffffff" text-anchor="middle">O Segredo dos Sons</text>
    <text x="300" y="380" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" fill="#94a3b8" text-anchor="middle">Escutar é viajar</text>
  </g>

  <!-- Caixa de Texto / História -->
  <g filter="url(#shadow)">
    <rect x="60" y="520" width="480" height="190" rx="20" fill="rgba(255, 255, 255, 0.08)" />
    <foreignObject x="80" y="545" width="440" height="140">
      <div xmlns="http://www.w3.org/1999/xhtml" style="font-family: 'Plus Jakarta Sans', sans-serif; font-size: 19px; line-height: 1.5; color: #ffffff; text-align: center; display: flex; flex-direction: column; justify-content: center; height: 100%;">
        <p style="margin: 0 0 10px 0; font-weight: 600;">Ele percebeu que cada som contava uma história mágica e invisível.</p>
        <p style="margin: 0; font-size: 15px; color: #94a3b8; font-style: italic;">"Um mundo inteiro revelado pelos ouvidos."</p>
      </div>
    </foreignObject>
  </g>

  <!-- Indicador discreto de rodapé da página -->
  <rect x="250" y="736" width="100" height="28" rx="14" fill="rgba(0,0,0,0.2)" />
  <text x="300" y="755" font-family="'Outfit', sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">Página 14 de 16</text>
</svg>